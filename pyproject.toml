[project]
name = "cbj-gameday-sentinel"
version = "1.4.1"
description = "Unofficial Columbus Blue Jackets system-tray ticker for Windows: live scores, goal horn, results, roster, and news."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pystray>=0.19.5", "Pillow>=10.3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
