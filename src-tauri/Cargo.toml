[package]
name = "cbj-sentinel-tauri"
version = "2.0.0"
description = "CBJ Gameday Sentinel - Ultra-Lightweight NHL Gameday Companion"
authors = ["Monocle Productions LLC"]
edition = "2021"

[lib]
name = "cbj_sentinel_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
