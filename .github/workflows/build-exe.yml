name: build-exe
# Build only:    Actions > build-exe > Run workflow (leave "tag" empty); the exe is an artifact.
# Build+release: run it with tag = v1.4.1 (must match __version__ and have release_notes/v1.4.1.md),
#                or push a v* tag. Either way the release is created on the commit that was built.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.4.1 (leave empty to only build)"
        required: false
        default: ""
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the app version
        if: env.RELEASE_TAG != ''
        shell: powershell
        run: |
          $v = python -c "from cbj_sentinel import __version__; print(__version__)"
          if ("v$v" -ne $env:RELEASE_TAG) { throw "Tag $env:RELEASE_TAG does not match __version__ $v" }
          if (-not (Test-Path "release_notes\$env:RELEASE_TAG.md")) { throw "Missing release_notes\$env:RELEASE_TAG.md" }
      - name: Build exe (runs tests, then PyInstaller)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\build_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CBJGamedaySentinel-windows
          path: |
            dist/CBJGamedaySentinel.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release
        if: env.RELEASE_TAG != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $lines = Get-Content "release_notes\$tag.md"
          $title = $lines[0] -replace '^#\s*', ''
          $hash = (Get-FileHash dist\CBJGamedaySentinel.exe -Algorithm SHA256).Hash
          $body = ($lines | Select-Object -Skip 1) -join "`n"
          $body += "`n`n### Checksums & Verification`n- ``CBJGamedaySentinel.exe``: ``$hash```n"
          Set-Content -Path notes.md -Value $body -Encoding utf8
          gh release create $tag dist\CBJGamedaySentinel.exe dist\SHA256SUMS.txt --target "${{ github.sha }}" --title "$title" --notes-file notes.md
